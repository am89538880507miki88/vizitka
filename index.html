<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арсентьев Михаил — визитка</title>
<style>
  :root {
    --bg: #07070d;
    --text: #f4f4fb;
    --muted: #9a9ab5;
    --c1: #7c3aed;
    --c2: #ec4899;
    --c3: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Плавающие светящиеся пятна на фоне */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  .glow.g1 { width: 420px; height: 420px; background: var(--c1); top: -120px; left: -100px; }
  .glow.g2 { width: 380px; height: 380px; background: var(--c2); bottom: -120px; right: -90px; animation-delay: -5s; }
  .glow.g3 { width: 260px; height: 260px; background: var(--c3); top: 45%; left: 55%; opacity: .25; animation-delay: -9s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 30px) scale(1.12); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 44px 30px 34px;
    text-align: center;
    background: rgba(18, 18, 30, .6);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
    animation: appear .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to { opacity: 1; transform: none; }
  }

  .avatar {
    width: 112px; height: 112px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 34px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .06), 0 0 40px rgba(236, 72, 153, .55);
    animation: pulse 3.5s ease-in-out infinite;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 30px rgba(236,72,153,.45); }
    50% { box-shadow: 0 0 0 8px rgba(255,255,255,.04), 0 0 60px rgba(124,58,237,.8); }
  }

  h1 {
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -.5px;
    background: linear-gradient(110deg, var(--c3), var(--c1) 35%, var(--c2) 70%, var(--c3));
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(168, 85, 247, .55));
    animation: shine 7s linear infinite;
  }
  @keyframes shine { to { background-position: 250% 0; } }

  .role {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
  }
  .role b { color: var(--text); font-weight: 600; }

  .tags {
    margin-top: 18px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .tags span {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    color: #d9d9ee;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
  }

  .socials {
    margin: 30px 0 28px;
    display: flex; gap: 16px; justify-content: center;
  }
  .social {
    width: 58px; height: 58px;
    border-radius: 18px;
    display: grid; place-items: center;
    color: #cfcfe6;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
    text-decoration: none;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, background .3s, color .3s;
  }
  .social svg { width: 28px; height: 28px; fill: currentColor; transition: transform .3s; }
  .social:hover, .social:focus-visible {
    transform: translateY(-6px) scale(1.1);
    color: #fff;
    outline: none;
  }
  .social:hover svg { transform: rotate(-8deg) scale(1.1); }
  .social.tg:hover, .social.tg:focus-visible {
    background: linear-gradient(135deg, #2aabee, #229ed9);
    box-shadow: 0 10px 30px rgba(42, 171, 238, .6);
  }
  .social.ig:hover, .social.ig:focus-visible {
    background: linear-gradient(45deg, #f9ce34, #ee2a7b 55%, #6228d7);
    box-shadow: 0 10px 30px rgba(238, 42, 123, .6);
  }

  .cta {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 18px 24px;
    font-size: 17px; font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 18px;
    background: linear-gradient(110deg, var(--c1), var(--c2), var(--c1));
    background-size: 200% 100%;
    overflow: hidden;
    animation: ctaPulse 2.4s ease-in-out infinite, flow 4s linear infinite;
    transition: transform .25s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .cta svg { width: 22px; height: 22px; fill: currentColor; transition: transform .35s; }
  .cta::after {            /* блик, пробегающий по кнопке */
    content: "";
    position: absolute; top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-3px) scale(1.02); outline: none; }
  .cta:hover svg { transform: translateX(5px) rotate(-12deg); }
  .cta:active { transform: scale(.97); }
  @keyframes flow { to { background-position: 200% 0; } }
  @keyframes sweep { 0% { left: -80%; } 60%, 100% { left: 140%; } }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, .55), 0 10px 30px rgba(124, 58, 237, .45); }
    50% { box-shadow: 0 0 0 14px rgba(236, 72, 153, 0), 0 14px 40px rgba(124, 58, 237, .7); }
  }

  .qr-title {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 0 0 16px;
    font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .qr-title span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18)); }
  .qr-title span:last-child { transform: scaleX(-1); }
  .qrs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-bottom: 26px;
  }
  .qr {
    --glow: 124, 58, 237;
    display: block; text-decoration: none; color: var(--text);
    padding: 10px 10px 12px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 1px solid rgba(255, 255, 255, .12);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, border-color .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .qr.tg { --glow: 42, 171, 238; }
  .qr.ig { --glow: 225, 48, 108; }
  .qr:hover, .qr:focus-visible {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(var(--glow), .7);
    box-shadow: 0 14px 40px rgba(var(--glow), .45);
    outline: none;
  }
  .qr .plate {
    background: #fff;
    border-radius: 14px;
    padding: 6px;
    line-height: 0;
    box-shadow: 0 0 0 3px rgba(var(--glow), .35), 0 0 26px rgba(var(--glow), .35);
  }
  .qr .plate svg { width: 100%; height: auto; display: block; }
  .qr .cap {
    margin-top: 11px;
    display: grid; grid-template-columns: auto 1fr; column-gap: 8px; text-align: left; align-items: center;
  }
  .qr .cap svg { grid-row: span 2; width: 22px; height: 22px; fill: rgb(var(--glow)); }
  .qr .cap b { font-size: 14px; line-height: 1.15; }
  .qr .cap small { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .more {
    display: inline-block; margin-top: 20px;
    font-size: 14px; color: #c9c9e3; text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.25); padding-bottom: 2px;
    transition: color .2s, border-color .2s;
  }
  .more:hover, .more:focus-visible { color: var(--c3); border-color: var(--c3); outline: none; }

  @media (max-width: 420px) {
    .card { padding: 36px 20px 26px; border-radius: 24px; }
    .social { width: 54px; height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var v = 0; v < size; v++) for (j = 0; j < 2; j++) {
        var x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!fn[y][x] && n < all.length * 8) { m[y][x] = ((all[n >>> 3] >>> (7 - (n & 7))) & 1) !== 0; n++; }
      }
    }
    var masks = [
      function (x, y) { return (x + y) % 2 === 0; },
      function (x, y) { return y % 2 === 0; },
      function (x, y) { return x % 3 === 0; },
      function (x, y) { return (x + y) % 3 === 0; },
      function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; },
      function (x, y) { return x * y % 2 + x * y % 3 === 0; },
      function (x, y) { return (x * y % 2 + x * y % 3) % 2 === 0; },
      function (x, y) { return ((x + y) % 2 + x * y % 3) % 2 === 0; }
    ];
    function apply(mk) {
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++)
        if (!fn[y][x] && masks[mk](x, y)) m[y][x] = !m[y][x];
    }
    function penalty() {
      var pen = 0, dark = 0, a, b, run, prev;
      for (a = 0; a < size; a++) {
        for (var dir = 0; dir < 2; dir++) {
          run = 0; prev = null;
          for (b = 0; b < size; b++) {
            var c = dir ? m[b][a] : m[a][b];
            if (c === prev) { run++; if (run === 5) pen += 3; else if (run > 5) pen++; } else { prev = c; run = 1; }
          }
        }
      }
      for (a = 0; a < size; a++) for (b = 0; b < size; b++) {
        if (m[a][b]) dark++;
        if (a < size - 1 && b < size - 1 && m[a][b] === m[a][b + 1] && m[a][b] === m[a + 1][b] && m[a][b] === m[a + 1][b + 1]) pen += 3;
      }
      return pen + (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
    }
    var best = 0, bestP = Infinity;
    for (k = 0; k < 8; k++) {
      apply(k); format(k);
      var pp = penalty();
      if (pp < bestP) { bestP = pp; best = k; }
      apply(k);
    }
    apply(best); format(best);
    return { size: size, m: m, fn: fn };
  }

  // Рисуем QR красивыми круглыми точками с градиентом
  function drawQR(el, text, id, c1, c2) {
    var q = makeQR(text), s = q.size, pad = 2, tot = s + pad * 2, out = '';
    out += '<svg viewBox="0 0 ' + tot + ' ' + tot + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR-код">';
    out += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>';
    out += '<g fill="url(#' + id + ')" stroke="url(#' + id + ')">';
    var eyes = [[0, 0], [s - 7, 0], [0, s - 7]];
    eyes.forEach(function (e) {
      var x = e[0] + pad, y = e[1] + pad;
      out += '<rect x="' + (x + .5) + '" y="' + (y + .5) + '" width="6" height="6" rx="2" fill="none" stroke-width="1"/>';
      out += '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" rx="1" stroke="none"/>';
    });
    for (var y = 0; y < s; y++) for (var x = 0; x < s; x++) {
      if (!q.m[y][x]) continue;
      if ((x < 7 && y < 7) || (x >= s - 7 && y < 7) || (x < 7 && y >= s - 7)) continue;
      out += '<circle cx="' + (x + pad + .5) + '" cy="' + (y + pad + .5) + '" r=".47" stroke="none"/>';
    }
    out += '</g></svg>';
    el.innerHTML = out;
  }
  drawQR(document.getElementById('qr-tg'), 'https://t.me/ArsMiki', 'gTg', '#2aabee', '#0a4f9e');
  drawQR(document.getElementById('qr-ig'), 'https://www.instagram.com/mr.mikki888', 'gIg', '#e1306c', '#5b3fd6');

  // Лёгкий наклон карточки за мышкой (только на компьютере)
  (function () {
    var card = document.getElementById('card');
    if (!window.matchMedia('(hover: hover)').matches) return;
    document.addEventListener('mousemove', function (e) {
      var x = (e.clientX / window.innerWidth - .5) * 2;
      var y = (e.clientY / window.innerHeight - .5) * 2;
      card.style.transform = 'perspective(900px) rotateY(' + (x * 6) + 'deg) rotateX(' + (-y * 6) + 'deg)';
    });
    document.addEventListener('mouseleave', function () { card.style.transform = ''; });
  })();
</script>
