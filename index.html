<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арсентьев Михаил — визитка</title>
<style>
  :root {
    --bg: #07070d;
    --text: #f4f4fb;
    --muted: #9a9ab5;
    --c1: #7c3aed;
    --c2: #ec4899;
    --c3: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Плавающие светящиеся пятна на фоне */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  .glow.g1 { width: 420px; height: 420px; background: var(--c1); top: -120px; left: -100px; }
  .glow.g2 { width: 380px; height: 380px; background: var(--c2); bottom: -120px; right: -90px; animation-delay: -5s; }
  .glow.g3 { width: 260px; height: 260px; background: var(--c3); top: 45%; left: 55%; opacity: .25; animation-delay: -9s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 30px) scale(1.12); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 44px 30px 34px;
    text-align: center;
    background: rgba(18, 18, 30, .6);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
    animation: appear .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to { opacity: 1; transform: none; }
  }

  .avatar {
    width: 112px; height: 112px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 34px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .06), 0 0 40px rgba(236, 72, 153, .55);
    animation: pulse 3.5s ease-in-out infinite;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 30px rgba(236,72,153,.45); }
    50% { box-shadow: 0 0 0 8px rgba(255,255,255,.04), 0 0 60px rgba(124,58,237,.8); }
  }

  h1 {
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -.5px;
    background: linear-gradient(110deg, var(--c3), var(--c1) 35%, var(--c2) 70%, var(--c3));
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(168, 85, 247, .55));
    animation: shine 7s linear infinite;
  }
  @keyframes shine { to { background-position: 250% 0; } }

  .role {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
  }
  .role b { color: var(--text); font-weight: 600; }

  .tags {
    margin-top: 18px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .tags span {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    color: #d9d9ee;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
  }

  .socials {
    margin: 30px 0 28px;
    display: flex; gap: 16px; justify-content: center;
  }
  .social {
    width: 58px; height: 58px;
    border-radius: 18px;
    display: grid; place-items: center;
    color: #cfcfe6;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
    text-decoration: none;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, background .3s, color .3s;
  }
  .social svg { width: 28px; height: 28px; fill: currentColor; transition: transform .3s; }
  .social:hover, .social:focus-visible {
    transform: translateY(-6px) scale(1.1);
    color: #fff;
    outline: none;
  }
  .social:hover svg { transform: rotate(-8deg) scale(1.1); }
  .social.tg:hover, .social.tg:focus-visible {
    background: linear-gradient(135deg, #2aabee, #229ed9);
    box-shadow: 0 10px 30px rgba(42, 171, 238, .6);
  }
  .social.ig:hover, .social.ig:focus-visible {
    background: linear-gradient(45deg, #f9ce34, #ee2a7b 55%, #6228d7);
    box-shadow: 0 10px 30px rgba(238, 42, 123, .6);
  }

  .cta {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 18px 24px;
    font-size: 17px; font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 18px;
    background: linear-gradient(110deg, var(--c1), var(--c2), var(--c1));
    background-size: 200% 100%;
    overflow: hidden;
    animation: ctaPulse 2.4s ease-in-out infinite, flow 4s linear infinite;
    transition: transform .25s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .cta svg { width: 22px; height: 22px; fill: currentColor; transition: transform .35s; }
  .cta::after {            /* блик, пробегающий по кнопке */
    content: "";
    position: absolute; top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-3px) scale(1.02); outline: none; }
  .cta:hover svg { transform: translateX(5px) rotate(-12deg); }
  .cta:active { transform: scale(.97); }
  @keyframes flow { to { background-position: 200% 0; } }
  @keyframes sweep { 0% { left: -80%; } 60%, 100% { left: 140%; } }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, .55), 0 10px 30px rgba(124, 58, 237, .45); }
    50% { box-shadow: 0 0 0 14px rgba(236, 72, 153, 0), 0 14px 40px rgba(124, 58, 237, .7); }
  }

  .qr-title {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 0 0 16px;
    font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .qr-title span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18)); }
  .qr-title span:last-child { transform: scaleX(-1); }
  .qrs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-bottom: 26px;
  }
  .qr {
    --glow: 124, 58, 237;
    display: block; text-decoration: none; color: var(--text);
    padding: 10px 10px 12px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 1px solid rgba(255, 255, 255, .12);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, border-color .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .qr.tg { --glow: 42, 171, 238; }
  .qr.ig { --glow: 225, 48, 108; }
  .qr:hover, .qr:focus-visible {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(var(--glow), .7);
    box-shadow: 0 14px 40px rgba(var(--glow), .45);
    outline: none;
  }
  .qr .plate {
    background: #fff;
    border-radius: 14px;
    padding: 6px;
    line-height: 0;
    box-shadow: 0 0 0 3px rgba(var(--glow), .35), 0 0 26px rgba(var(--glow), .35);
  }
  .qr .plate svg { width: 100%; height: auto; display: block; }
  .qr .cap {
    margin-top: 11px;
    display: grid; grid-template-columns: auto 1fr; column-gap: 8px; text-align: left; align-items: center;
  }
  .qr .cap svg { grid-row: span 2; width: 22px; height: 22px; fill: rgb(var(--glow)); }
  .qr .cap b { font-size: 14px; line-height: 1.15; }
  .qr .cap small { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 420px) {
    .card { padding: 36px 20px 26px; border-radius: 24px; }
    .social { width: 54px; height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
  // QR-код рисуется прямо в браузере, без внешних библиотек
  function makeQR(text) {
    var bytes = Array.from(new TextEncoder().encode(text));
    var ECC = [10, 16, 26, 18, 24, 16], BLK = [1, 1, 2, 2, 4, 4]; // уровень коррекции M, версии 1–6
    function raw(v) {
      var r = (16 * v + 128) * v + 64;
      if (v >= 2) { var a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; }
      return r;
    }
    var ver, cap;
    for (ver = 1; ver <= 6; ver++) {
      cap = Math.floor(raw(ver) / 8) - ECC[ver - 1] * BLK[ver - 1];
      if (12 + bytes.length * 8 <= cap * 8) break;
    }
    if (ver > 6) throw new Error('Текст слишком длинный для QR');
    var size = ver * 4 + 17, i, j, k;

    // 1. данные
    var bb = [];
    function put(v, n) { for (var t = n - 1; t >= 0; t--) bb.push((v >>> t) & 1); }
    put(4, 4); put(bytes.length, 8);
    bytes.forEach(function (b) { put(b, 8); });
    put(0, Math.min(4, cap * 8 - bb.length));
    while (bb.length % 8) bb.push(0);
    var data = [];
    for (i = 0; i < bb.length; i += 8) {
      var byte = 0;
      for (j = 0; j < 8; j++) byte = (byte << 1) | bb[i + j];
      data.push(byte);
    }
    for (var pad = 0xEC; data.length < cap; pad ^= 0xEC ^ 0x11) data.push(pad);

    // 2. коды исправления ошибок (Рида — Соломона)
    function mul(x, y) {
      var z = 0;
      for (var t = 7; t >= 0; t--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> t) & 1) * x; }
      return z;
    }
    var nb = BLK[ver - 1], el = ECC[ver - 1];
    var div = [], root = 1;
    for (i = 0; i < el; i++) div.push(0);
    div[el - 1] = 1;
    for (i = 0; i < el; i++) {
      for (j = 0; j < el; j++) { div[j] = mul(div[j], root); if (j + 1 < el) div[j] ^= div[j + 1]; }
      root = mul(root, 2);
    }
    var rawCw = Math.floor(raw(ver) / 8), nShort = nb - rawCw % nb, shortLen = Math.floor(rawCw / nb);
    var blocks = [];
    for (i = 0, k = 0; i < nb; i++) {
      var dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1));
      k += dat.length;
      var rem = [];
      for (j = 0; j < el; j++) rem.push(0);
      dat.forEach(function (b) {
        var f = b ^ rem.shift(); rem.push(0);
        div.forEach(function (c, n) { rem[n] ^= mul(c, f); });
      });
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(rem));
    }
    var all = [];
    for (i = 0; i < blocks[0].length; i++)
      for (j = 0; j < nb; j++)
        if (i !== shortLen - el || j >= nShort) all.push(blocks[j][i]);

    // 3. матрица
    var m = [], fn = [];
    for (i = 0; i < size; i++) { m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    function set(x, y, d) { m[y][x] = d; fn[y][x] = true; }
    for (i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (c) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy)), x = c[0] + dx, y = c[1] + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    });
    if (ver > 1) {
      var na = Math.floor(ver / 7) + 2;
      var step = Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2;
      var pos = [6];
      for (var p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (i = 0; i < na; i++) for (j = 0; j < na; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
        for (var ay = -2; ay <= 2; ay++) for (var ax = -2; ax <= 2; ax++)
          set(pos[i] + ax, pos[j] + ay, Math.max(Math.abs(ax), Math.abs(ay)) !== 1);
      }
    }
    function format(mask) {
      var d = mask, r = d; // уровень M = 00
      for (var t = 0; t < 10; t++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      var bits = ((d << 10) | r) ^ 0x5412;
      function bit(n) { return ((bits >>> n) & 1) !== 0; }
      for (var t2 = 0; t2 <= 5; t2++) set(8, t2, bit(t2));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (var t3 = 9; t3 < 15; t3++) set(14 - t3, 8, bit(t3));
      for (var t4 = 0; t4 < 8; t4++) set(size - 1 - t4, 8, bit(t4));
      for (var t5 = 8; t5 < 15; t5++) set(8, size - 15 + t5, bit(t5));
      set(8, size - 8, true);
    }
    format(0);
    var n = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var v = 0; v < size; v++) for (j = 0; j < 2; j++) {
        var x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!fn[y][x] && n < all.length * 8) { m[y][x] = ((all[n >>> 3] >>> (7 - (n & 7))) & 1) !== 0; n++; }
      }
    }
    var masks = [
      function (x, y) { return (x + y) % 2 === 0; },
      function (x, y) { return y % 2 === 0; },
      function (x, y) { return x % 3 === 0; },
      function (x, y) { return (x + y) % 3 === 0; },
      function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; },
      function (x, y) { return x * y % 2 + x * y % 3 === 0; },
      function (x, y) { return (x * y % 2 + x * y % 3) % 2 === 0; },
      function (x, y) { return ((x + y) % 2 + x * y % 3) % 2 === 0; }
    ];
    function apply(mk) {
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++)
        if (!fn[y][x] && masks[mk](x, y)) m[y][x] = !m[y][x];
    }
    function penalty() {
      var pen = 0, dark = 0, a, b, run, prev;
      for (a = 0; a < size; a++) {
        for (var dir = 0; dir < 2; dir++) {
          run = 0; prev = null;
          for (b = 0; b < size; b++) {

            if (c === prev) { run++; if (run === 5) pen += 3; else if (run > 5) pen++; } else { prev = c; run = 1; }
          }

      for (a = 0; a < size; a++) for (b = 0; b < size; b++) {
        if (m[a][b]) dark++;
        if (a < size - 1 && b < size - 1 && m[a][b] === m[a][b + 1] && m[a][b] === m[a + 1][b] && m[a][b] === m[a + 1][b + 1]) pen += 3;
      }
      return pen + (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
    }
    var best = 0, bestP = Infinity;
    for (k = 0; k < 8; k++) {
      apply(k); format(k);
      var pp = penalty();
      if (pp < bestP) { bestP = pp; best = k; }
      apply(k);
    }
    apply(best); format(best);
    return { size: size, m: m, fn: fn };
  }
